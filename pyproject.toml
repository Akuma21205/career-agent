[project]
name = "career-agent"
version = "0.1.0"
description = "Autonomous AI career agent - job hunting, CV tailoring, interview prep"
requires-python = ">=3.11"
dependencies = [
    "sqlite-vec>=0.1.6",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "loguru>=0.7.2",
    "sentence-transformers>=3.0.0",
    "google-generativeai>=0.7.0",
    "apscheduler>=3.10.4",
    "tenacity>=8.3.0",
    "mcp>=0.9.0",
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "google-api-python-client>=2.116.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/career_agent"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "ipython>=8.0.0",
]
